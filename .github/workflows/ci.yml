name: AcoustiSolar CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        # PyTorch is optional and not installed in CI: the deep-model test is skipped.
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy pandas pydantic pyyaml scikit-learn joblib pyarrow pytest pytest-cov ruff

      - name: Lint with ruff (errors only)
        run: |
          ruff check --select E9,F63,F7,F82 .

      - name: Run unit, property and regression tests with coverage
        env:
          PYTHONPATH: packages/schemas/src:packages/physics/src:packages/daqtwin/src:packages/dsp/src:packages/ml/src:packages/sdk/src
        run: |
          pytest --cov=packages --cov-report=term-missing --cov-report=xml tests/

      - name: Run physics V&V suite (fails on any FAIL; KPI gaps are reported, not failed)
        env:
          PYTHONPATH: packages/schemas/src:packages/physics/src:packages/daqtwin/src:packages/dsp/src:packages/ml/src:packages/sdk/src
        run: |
          python validation/run_vv_suite.py
