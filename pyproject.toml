[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acoustisolar-monorepo"
version = "0.1.0"
description = "Simulation-first acoustic emission platform for solar panel micro-crack detection"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "AcoustiSolar Engineering Team", email = "engineering@acoustisolar.io" }]
license = { text = "Apache-2.0" }
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.11.0",          # SAFE eigen-solver, causal IIR filters, Bessel aperture, GPD tail fit
    "pandas>=2.0.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.4.0",    # AEFeatureClassifier (HistGradientBoosting)
    "joblib>=1.3.0",
    "torch>=2.13.0",          # Waveform1DResNet (optional); >=2.13 fixes PYSEC-2025-194
]
data = [
    "pyarrow>=14.0.0",        # Parquet event index
]
demo = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
]
dev = [
    "pytest>=9.0.3",          # >=9.0.3 fixes PYSEC-2026-1845
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "matplotlib>=3.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "packages/schemas/src",
    "packages/physics/src",
    "packages/daqtwin/src",
    "packages/dsp/src",
    "packages/ml/src",
    "packages/sdk/src",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

